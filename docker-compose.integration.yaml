name: flux-core-integration
services:
    engine:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            - ENGINE_WORKER_COUNT=1
            - ENGINE_MAX_CLIENTS=10000
        ports:
            - "8080:8080"
            - "8081:8081"
        healthcheck:
            test: ["CMD", "nc", "-z", "localhost", "8081"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s